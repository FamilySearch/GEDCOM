# This action will copy changes from main into the v7.1 branch, and is done whenever the main branch is updated.
#
# For documentation on the github environment, see
# https://docs.github.com/en/actions/using-github-hosted-runners/about-github-hosted-runners
#
# For documentation on the syntax of this file, see
# https://docs.github.com/en/actions/reference/workflow-syntax-for-github-actions
---
name: Propagate main to 7.1

on:
  push:
    branches: [main]

permissions:
  contents: read

# One run at a time: a newer push waits for the running one, so an older run can't force-push stale state over it.
concurrency:
  group: propagate-main-to-v7.1
  cancel-in-progress: false

jobs:
  merge-to-v71:
    permissions:
      contents: write  # for Git to git push
      pull-requests: write  # for Git to create a pull request
    runs-on: ubuntu-latest

    steps:
      - name: Check out GEDCOM
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Set git config
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global user.email "${GITHUB_ACTOR}@users.noreply.github.com"
          git config --global user.name "$(gh api "/users/${GITHUB_ACTOR}" | jq .name -r)"
          git config -l

      - name: Check for diffs excluding extracted-files
        id: diff
        run: |
          git fetch origin
          # Check for differences excluding extracted-files directory
          if ! git diff --quiet origin/main..origin/v7.1 -- . ':!extracted-files'; then
            echo "status=changes" >> "${GITHUB_OUTPUT}"
          fi

      - name: Create merge branch and merge main excluding extracted-files
        if: steps.diff.outputs.status == 'changes'
        id: merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Checkout v7.1 and create merge branch
          git checkout -B merge-main-into-v7.1 origin/v7.1

          merge_conflicts=false
          conflict_files=""
          if ! git merge --no-ff --no-commit origin/main; then
            conflict_files="$(git diff --name-only --diff-filter=U -- . ':!extracted-files' | tr '\n' ' ' | sed 's/[[:space:]]*$//')"
            if [ -n "${conflict_files}" ]; then
              merge_conflicts=true
            fi
            git merge --abort
            git merge --no-ff --no-commit -X ours origin/main
          fi

          # Keep extracted-files from v7.1
          git restore --source=origin/v7.1 --staged --worktree extracted-files/
          git add .

          if [ -f .git/MERGE_HEAD ]; then
            merged_commit="$(printf "temporary merge check\n" | git commit-tree "$(git write-tree)" -p "$(git rev-parse HEAD)" -p "$(cat .git/MERGE_HEAD)")"
          else
            merged_commit="$(printf "temporary merge check\n" | git commit-tree "$(git write-tree)" -p "$(git rev-parse HEAD)")"
          fi
          if git diff --quiet origin/v7.1 "${merged_commit}" -- . ':!extracted-files'; then
            if [ -f .git/MERGE_HEAD ]; then
              git merge --abort
            fi
            echo "changes_to_commit=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          git commit -m "Merge main into v7.1 (excluding extracted-files)"
          git push -f --set-upstream origin merge-main-into-v7.1

          {
            echo "changes_to_commit=true"
            echo "merge_conflicts=${merge_conflicts}"
            echo "conflict_files=${conflict_files}"
          } >> "${GITHUB_OUTPUT}"

      - name: Close a stale propagation PR
        if: steps.diff.outputs.status != 'changes' || steps.merge.outputs.changes_to_commit == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          stale_pr_number="$(gh pr list --head merge-main-into-v7.1 --base v7.1 --state open --json number --jq '.[0].number // empty' --repo "${REPO}")"
          if [ -n "${stale_pr_number}" ]; then
            # shellcheck disable=SC2016  # the backticks are Markdown, not command substitution
            gh pr close "${stale_pr_number}" --repo "${REPO}" --comment 'Closing because `main` and `v7.1` no longer differ outside `extracted-files/`.'
          fi

      - name: Create Pull Request
        if: steps.merge.outputs.changes_to_commit == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          MERGE_CONFLICTS: ${{ steps.merge.outputs.merge_conflicts }}
          CONFLICT_FILES: ${{ steps.merge.outputs.conflict_files }}
        run: |
          # Values from earlier steps arrive as environment variables, never pasted into the script, so a file name
          # with a quote or $(...) in it stays text. The backticks below are Markdown.
          # shellcheck disable=SC2016
          intro='This PR merges changes from `main` into `v7.1` while restoring `extracted-files/` from `v7.1`.'
          outro=$'The extracted-files will be handled separately by the generate-files workflow.\nThis PR is auto-generated by [gh pr create].'
          pr_title='Merge main into v7.1 (excluding extracted-files)'
          if [ "${MERGE_CONFLICTS}" = "true" ]; then
            # shellcheck disable=SC2016
            pr_body="$(printf '%s\n\n%s\nConflicted files: `%s`\n\n%s' "${intro}" 'Merge conflicts were detected during automation and auto-resolved in favor of `v7.1` for conflicting hunks. Please review carefully.' "${CONFLICT_FILES}" "${outro}")"
          else
            pr_body="$(printf '%s\n\n%s' "${intro}" "${outro}")"
          fi

          pr_number="$(gh pr list --head merge-main-into-v7.1 --base v7.1 --state open --json number --jq '.[0].number // empty' --repo "${REPO}")"
          if [ -z "${pr_number}" ]; then
            if [ "${MERGE_CONFLICTS}" = "true" ]; then
              gh pr create -B v7.1 -H merge-main-into-v7.1 --title "${pr_title}" --body "${pr_body}" --label 'automated pr' --draft --repo "${REPO}"
            else
              gh pr create -B v7.1 -H merge-main-into-v7.1 --title "${pr_title}" --body "${pr_body}" --label 'automated pr' --repo "${REPO}"
            fi
          else
            gh pr edit "${pr_number}" --title "${pr_title}" --body "${pr_body}" --repo "${REPO}"
            # A PR with conflicts must be a draft, and one without must be ready: change it only when it's the wrong
            # one, and let a failure fail the run rather than leave a conflicted PR ready to merge.
            is_draft="$(gh pr view "${pr_number}" --json isDraft --jq '.isDraft' --repo "${REPO}")"
            if [ "${MERGE_CONFLICTS}" = "true" ] && [ "${is_draft}" != "true" ]; then
              pr_id="$(gh pr view "${pr_number}" --json id --jq '.id' --repo "${REPO}")"
              # shellcheck disable=SC2016  # $id is a GraphQL variable, not the shell's
              gh api graphql -f query='mutation($id:ID!){convertPullRequestToDraft(input:{pullRequestId:$id}){pullRequest{id}}}' -f id="${pr_id}" >/dev/null
            elif [ "${MERGE_CONFLICTS}" != "true" ] && [ "${is_draft}" = "true" ]; then
              gh pr ready "${pr_number}" --repo "${REPO}"
            fi
          fi
