# This action will copy changes from main into the v7.1 branch, and is done whenever the main branch is updated.
#
# For documentation on the github environment, see
# https://docs.github.com/en/actions/using-github-hosted-runners/about-github-hosted-runners
#
# For documentation on the syntax of this file, see
# https://docs.github.com/en/actions/reference/workflow-syntax-for-github-actions
---
name: Propagate main to 7.1

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  merge-to-v71:
    permissions:
      contents: write  # for Git to git push
      pull-requests: write  # for Git to create a pull request
    runs-on: ubuntu-latest

    steps:
      - name: Check out GEDCOM
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Set git config
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global user.email "${GITHUB_ACTOR}@users.noreply.github.com"
          git config --global user.name "$(gh api /users/${GITHUB_ACTOR} | jq .name -r)"
          git config -l

      - name: Check for diffs excluding extracted-files
        id: diff
        run: |
          git fetch origin
          # Check for differences excluding extracted-files directory
          if ! git diff --quiet origin/main..origin/v7.1 -- . ':!extracted-files'; then
            echo "status=changes" >> "${GITHUB_OUTPUT}"
          fi

      - name: Create merge branch and merge main excluding extracted-files
        if: steps.diff.outputs.status == 'changes'
        id: merge
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_TOKEN }}
        run: |
          # Checkout v7.1 and create merge branch
          git checkout -B merge-main-into-v7.1 origin/v7.1

          merge_conflicts=false
          conflict_files=""
          if ! git merge --no-ff --no-commit origin/main; then
            merge_conflicts=true
            conflict_files="$(git diff --name-only --diff-filter=U | tr '\n' ' ' | sed 's/[[:space:]]*$//')"
            git merge --abort
            git merge --no-ff --no-commit -X ours origin/main
          fi

          # Keep extracted-files from v7.1
          git restore --source=origin/v7.1 --staged --worktree extracted-files/
          git add .

          if git diff --cached --quiet; then
            echo "changes_to_commit=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          git commit -m "Merge main into v7.1 (excluding extracted-files)"
          git push -f --set-upstream origin merge-main-into-v7.1

          {
            echo "changes_to_commit=true"
            echo "merge_conflicts=${merge_conflicts}"
            echo "conflict_files=${conflict_files}"
          } >> "${GITHUB_OUTPUT}"

      - name: Create Pull Request
        if: steps.merge.outputs.changes_to_commit == 'true'
        run: |
          pr_title='Merge main into v7.1 (excluding extracted-files)'
          if [ "${{ steps.merge.outputs.merge_conflicts }}" = "true" ]; then
            pr_body=$'This PR merges changes from `main` into `v7.1` while restoring `extracted-files/` from `v7.1`.\n\nMerge conflicts were detected during automation and auto-resolved in favor of `v7.1` for conflicting hunks. Please review carefully.\nConflicted files: `${{ steps.merge.outputs.conflict_files }}`\n\nThe extracted-files will be handled separately by the generate-files workflow.\nThis PR is auto-generated by [gh pr create].'
          else
            pr_body=$'This PR merges changes from `main` into `v7.1` while restoring `extracted-files/` from `v7.1`.\n\nThe extracted-files will be handled separately by the generate-files workflow.\nThis PR is auto-generated by [gh pr create].'
          fi

          pr_number="$(gh pr list --head merge-main-into-v7.1 --base v7.1 --json number --jq '.[0].number')"
          if [ -z "${pr_number}" ]; then
            if [ "${{ steps.merge.outputs.merge_conflicts }}" = "true" ]; then
              gh pr create -B v7.1 -H merge-main-into-v7.1 --title "${pr_title}" --body "${pr_body}" --label 'automated pr' --draft --repo ${{ github.repository }}
            else
              gh pr create -B v7.1 -H merge-main-into-v7.1 --title "${pr_title}" --body "${pr_body}" --label 'automated pr' --repo ${{ github.repository }}
            fi
          else
            gh pr edit "${pr_number}" --title "${pr_title}" --body "${pr_body}" --repo ${{ github.repository }}
            if [ "${{ steps.merge.outputs.merge_conflicts }}" = "true" ]; then
              gh pr ready "${pr_number}" --undo --repo ${{ github.repository }} || true
            else
              gh pr ready "${pr_number}" --repo ${{ github.repository }} || true
            fi
          fi
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_TOKEN }}
